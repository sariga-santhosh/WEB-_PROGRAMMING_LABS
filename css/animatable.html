<!DOCTYPE html>
<html>
<head>
    <title>CSS Animatable</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>CSS Animatable Reference</h1>

    <p>
        Animatable CSS properties are properties whose values can
        smoothly change during an animation.
    </p>

    <h3>Examples</h3>

    <ul>
        <li>width</li>
        <li>height</li>
        <li>color</li>
        <li>background-color</li>
        <li>opacity</li>
        <li>margin</li>
        <li>padding</li>
        <li>transform</li>
    </ul>

</body>
</html>
