<!DOCTYPE html>
<html>
<head>
    <title>CSS Colors</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>CSS Color Reference</h1>

    <p>
        CSS provides different ways to specify colors for HTML elements.
    </p>

    <h3>Ways to Define Colors</h3>

    <ul>
        <li><b>Color Names</b> – red, blue, pink, green</li>
        <li><b>HEX</b> – #ff0000</li>
        <li><b>RGB</b> – rgb(255, 0, 0)</li>
        <li><b>RGBA</b> – rgba(255, 0, 0, 0.5)</li>
        <li><b>HSL</b> – hsl(0, 100%, 50%)</li>
    </ul>

</body>
</html>
