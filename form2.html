<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration Form</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      display: flex;
      justify-content: center;
      padding-top: 40px;
    }
    form {
      background: #fff;
      padding: 25px 30px;
      border-radius: 8px;
      width: 320px;
      box-shadow: 0 0 8px rgba(0, 0, 0, 0.2);
    }
    h2 { text-align: center; margin-top: 0; }
    label { display: block; margin-top: 12px; font-weight: bold; }
    input {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      margin-top: 20px;
      padding: 10px;
      background: #2e7d32;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover { background: #1b5e20; }
  </style>
</head>
<body>

  <form id="regForm" onsubmit="return validateForm()">
    <h2>Registration Form</h2>

    <label for="name">Name</label>
    <input type="text" id="name" placeholder="Enter your name">

    <label for="email">Email</label>
    <input type="text" id="email" placeholder="Enter your email">

    <label for="mobile">Mobile Number</label>
    <input type="text" id="mobile" placeholder="10-digit mobile number">

    <label for="username">Username</label>
    <input type="text" id="username" placeholder="Choose a username">

    <label for="password">Password</label>
    <input type="password" id="password" placeholder="Enter a strong password">

    <button type="submit">Submit</button>
  </form>

  <script>
    function validateForm() {
      var name = document.getElementById("name").value.trim();
      var email = document.getElementById("email").value.trim();
      var mobile = document.getElementById("mobile").value.trim();
      var username = document.getElementById("username").value.trim();
      var password = document.getElementById("password").value;

      // 1. Name: not empty, only letters and spaces
      if (name === "") {
        alert("Name cannot be empty.");
        return false;
      }
      var namePattern = /^[A-Za-z ]+$/;
      if (!namePattern.test(name)) {
        alert("Name can contain only letters and spaces.");
        return false;
      }

      // 2. Email: basic format check
      var emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailPattern.test(email)) {
        alert("Please enter a valid email address.");
        return false;
      }

      // 3. Mobile: exactly 10 digits
      var mobilePattern = /^[0-9]{10}$/;
      if (!mobilePattern.test(mobile)) {
        alert("Mobile number must contain exactly 10 digits.");
        return false;
      }

      // 4. Username: not empty
      if (username === "") {
        alert("Username cannot be empty.");
        return false;
      }

      // 5. Password: min 8 chars, upper, lower, digit, special character
      if (password.length < 8) {
        alert("Password must be at least 8 characters long.");
        return false;
      }
      if (!/[A-Z]/.test(password)) {
        alert("Password must contain at least one uppercase letter.");
        return false;
      }
      if (!/[a-z]/.test(password)) {
        alert("Password must contain at least one lowercase letter.");
        return false;
      }
      if (!/[0-9]/.test(password)) {
        alert("Password must contain at least one digit.");
        return false;
      }
      if (!/[^A-Za-z0-9]/.test(password)) {
        alert("Password must contain at least one special character (e.g. @, #, $, !).");
        return false;
      }

      // All checks passed
      alert("Form submitted successfully!");
      return true;
    }
  </script>

</body>
</html>
